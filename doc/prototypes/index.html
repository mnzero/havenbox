<title>Havenbox · V0.5 可点击原型</title>
<style>
:root { color-scheme: light dark; background: light-dark(#f6f7f4, #171c19); }

<body>
<style>
#havenbox-v05{color-scheme:light dark;--hv-bg:light-dark(#f6f7f4,#171c19);--hv-paper:light-dark(#fff,#202923);--hv-ink:light-dark(#20372d,#e4ece6);--hv-sub:light-dark(#596b60,#a7b7ac);--hv-line:light-dark(#dce3dd,#3a493f);--hv-green:light-dark(#285a43,#add5b6);--hv-on:light-dark(#fff,#172a1d);--hv-soft:light-dark(#eaf0e9,#2d3c31);--hv-amber:light-dark(#845211,#f0c07f);--hv-red:light-dark(#a33332,#ffb0a7);font:14px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;background:var(--hv-bg);color:var(--hv-ink);border:1px solid var(--hv-line);border-radius:14px;overflow:clip;min-height:760px}
#havenbox-v05 *{box-sizing:border-box}#havenbox-v05 [hidden]{display:none!important}#havenbox-v05 button,#havenbox-v05 select,#havenbox-v05 textarea,#havenbox-v05 input{font:inherit;max-width:100%}#havenbox-v05 button{display:inline-flex;gap:7px;align-items:center;justify-content:center;text-align:left;padding:7px 11px;border:1px solid var(--hv-line);border-radius:8px;background:var(--hv-paper);color:var(--hv-ink);white-space:normal}#havenbox-v05 button:disabled{opacity:.45;cursor:default}#havenbox-v05 .hv-primary{color:var(--hv-on);background:var(--hv-green);border-color:var(--hv-green)}#havenbox-v05 .hv-quiet{background:transparent;border-color:transparent}#havenbox-v05 .hv-danger{color:var(--hv-red)}#havenbox-v05 button[aria-pressed=true]{background:var(--hv-soft);border-color:var(--hv-green)}#havenbox-v05 .hv-top{padding:16px 104px 14px 18px;display:flex;gap:18px;align-items:center;flex-wrap:wrap;background:var(--hv-paper);border-bottom:1px solid var(--hv-line)}#havenbox-v05 .hv-brand{font-size:18px;letter-spacing:-.6px;font-weight:500;display:flex;gap:8px;align-items:center}#havenbox-v05 .hv-logo{background:var(--hv-green);color:var(--hv-on);border-radius:8px;padding:2px 8px;font-size:14px}#havenbox-v05 .hv-nav{display:flex;gap:3px;flex-wrap:wrap}#havenbox-v05 .hv-nav button{border-color:transparent;background:transparent;font-size:12px}#havenbox-v05 .hv-nav button[aria-pressed=true]{background:var(--hv-soft)}#havenbox-v05 .hv-demo{display:flex;gap:10px;flex-wrap:wrap;justify-content:space-between;padding:8px 18px;border-bottom:1px solid var(--hv-line);font-size:11px;color:var(--hv-sub)}#havenbox-v05 .hv-live{background:var(--hv-soft);padding:10px 18px;display:flex;align-items:center;gap:10px;justify-content:space-between;flex-wrap:wrap;border-bottom:1px solid var(--hv-line)}#havenbox-v05 .hv-live p{margin:0;font-size:12px}#havenbox-v05 .hv-layout{display:grid;grid-template-columns:185px minmax(0,1fr)}#havenbox-v05 .hv-side{padding:18px 12px;border-right:1px solid var(--hv-line);min-width:0}#havenbox-v05 .hv-side .hv-new{width:100%;justify-content:flex-start}#havenbox-v05 .hv-side input{margin:14px 0 7px;font-size:12px}#havenbox-v05 .hv-session{display:block;width:100%;justify-content:flex-start;background:transparent;border-color:transparent;text-align:left;margin:5px 0;padding:10px;overflow-wrap:anywhere}#havenbox-v05 .hv-session span{display:block}#havenbox-v05 .hv-session small{display:block;color:var(--hv-sub);font-size:11px}#havenbox-v05 .hv-content{min-width:0}#havenbox-v05 .hv-chat-layout{display:grid;grid-template-columns:minmax(0,1fr) 240px;min-height:650px}#havenbox-v05 .hv-chat{padding:var(--hv-chat-space,24px);min-width:0}#havenbox-v05 .hv-files{border-left:1px solid var(--hv-line);background:var(--hv-paper);padding:22px 16px;min-width:0}#havenbox-v05 h2{font-size:23px;line-height:1.35;font-weight:500;letter-spacing:-.6px;margin:0 0 10px}#havenbox-v05 h3{font-size:14px;font-weight:500;margin:0 0 10px}#havenbox-v05 p{margin:8px 0}#havenbox-v05 .hv-sub{font-size:12px;color:var(--hv-sub)}#havenbox-v05 .hv-eyebrow{font-size:11px;letter-spacing:1px;color:var(--hv-sub);margin-bottom:7px}#havenbox-v05 .hv-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}#havenbox-v05 .hv-between{display:flex;gap:12px;justify-content:space-between;align-items:flex-start;flex-wrap:wrap}#havenbox-v05 .hv-badge{font-size:11px;display:inline-block;padding:3px 7px;border-radius:5px;color:var(--hv-green);background:var(--hv-soft)}#havenbox-v05 .hv-message{padding:19px 0;border-bottom:1px solid var(--hv-line);overflow-wrap:anywhere}#havenbox-v05 .hv-message .hv-speaker{font-size:11px;color:var(--hv-sub);margin-bottom:7px}#havenbox-v05 .hv-user{margin-left:26px}#havenbox-v05 .hv-card{padding:17px;border:1px solid var(--hv-line);border-radius:12px;background:var(--hv-paper);margin:16px 0}#havenbox-v05 .hv-detail{padding:10px 0;border-bottom:1px solid var(--hv-line)}#havenbox-v05 .hv-detail:last-child{border:0}#havenbox-v05 .hv-detail small{display:block;font-size:11px;color:var(--hv-sub);margin-bottom:3px}#havenbox-v05 .hv-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:16px}#havenbox-v05 .hv-composer{margin-top:23px}#havenbox-v05 input:not([type=checkbox]),#havenbox-v05 select,#havenbox-v05 textarea{width:100%;background:var(--hv-paper);border:1px solid var(--hv-line);border-radius:8px;padding:9px 11px;color:var(--hv-ink)}#havenbox-v05 textarea{min-height:90px;resize:vertical;margin-top:7px}#havenbox-v05 label{display:block;font-size:12px}#havenbox-v05 .hv-check{display:flex;gap:9px;align-items:flex-start;padding:10px 0;font-size:12px}#havenbox-v05 .hv-check input{margin-top:5px;accent-color:var(--hv-green)}#havenbox-v05 .hv-file{padding:12px 0;border-bottom:1px solid var(--hv-line);overflow-wrap:anywhere}#havenbox-v05 .hv-file button{padding:3px 0;border-color:transparent;background:transparent;justify-content:flex-start}#havenbox-v05 .hv-file small{display:block;font-size:11px;color:var(--hv-sub)}#havenbox-v05 .hv-section{padding:28px;max-width:900px;margin:auto}#havenbox-v05 .hv-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;margin-top:20px}#havenbox-v05 .hv-form{display:grid;gap:14px}#havenbox-v05 .hv-warn{color:var(--hv-amber)}#havenbox-v05 .hv-error{color:var(--hv-red)}#havenbox-v05 pre,#havenbox-v05 code{font:12px/1.7 ui-monospace,SFMono-Regular,monospace;white-space:pre-wrap;overflow-wrap:anywhere}#havenbox-v05 pre{padding:15px;background:var(--hv-paper);border:1px solid var(--hv-line);border-radius:8px}#havenbox-v05 .hv-table{overflow:auto}#havenbox-v05 table{width:100%;border-collapse:collapse;font-size:12px;margin:12px 0}#havenbox-v05 th,#havenbox-v05 td{padding:9px 6px;text-align:left;border-bottom:1px solid var(--hv-line);white-space:nowrap}#havenbox-v05 th{font-weight:500;color:var(--hv-sub)}#havenbox-v05 td:last-child,#havenbox-v05 th:last-child{text-align:right;font-variant-numeric:tabular-nums}#havenbox-v05 .hv-footer{padding:12px 18px;border-top:1px solid var(--hv-line);font-size:11px;color:var(--hv-sub)}#havenbox-v05 .hv-approval{border-color:var(--hv-green)}#havenbox-v05 .hv-manage{margin-top:16px;border-top:1px solid var(--hv-line);padding-top:12px}#havenbox-v05 .hv-manage button{font-size:11px}#havenbox-v05 .hv-space{margin-top:24px}
@media(max-width:950px){#havenbox-v05 .hv-chat-layout{grid-template-columns:minmax(0,1fr)}#havenbox-v05 .hv-files{border-left:0;border-top:1px solid var(--hv-line)}#havenbox-v05 .hv-grid{grid-template-columns:1fr}}
@media(max-width:600px){#havenbox-v05 .hv-layout{display:block}#havenbox-v05 .hv-side{border-right:0;border-bottom:1px solid var(--hv-line)}#havenbox-v05 .hv-session{display:inline-block;width:auto;vertical-align:top;max-width:100%;margin-right:5px}#havenbox-v05 .hv-side input{margin-top:8px}#havenbox-v05 .hv-section,#havenbox-v05 .hv-chat{padding:20px 16px}#havenbox-v05 .hv-top{padding:16px;padding-right:94px}#havenbox-v05 .hv-nav{width:100%}#havenbox-v05 .hv-user{margin-left:12px}}
@media(pointer:coarse){#havenbox-v05 button{min-height:44px}#havenbox-v05 textarea,#havenbox-v05 select,#havenbox-v05 input{font-size:16px}}
</style>
<div id="havenbox-v05" aria-label="Havenbox V0.5 会话式工作台设计"></div>
<script>
(()=>{
const root=document.getElementById('havenbox-v05');
const esc=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rows=[['H001','杭州',100],['H002','杭州',-20],['S001','上海',200],['H003','杭州',120],['S002','上海',150],['Z001','苏州',150]];
let serial=10,page='chat',cid='c1',active=null,panel=null,notice='',archiveFilter=false,search='',modelTab='api',toolTab='harness',harness='Pi',binding='local',preview=null,rename='',carryText=false,carryFiles=false,targetProfile='p-local',consentResults=false,toolRevision=1;
const model={name:'示例 API 连接',template:'custom',protocol:'chat-completions',url:'https://api.example.invalid/v1',id:'demo-tool-model',temperature:'0.2',context:'待实际配置',output:'待实际配置',timeout:'待实际配置',quota:'待实际配置',saved:false,key:false,connected:false,capable:false,rev:1};
const local={installed:true,capable:true,rev:1,package:'prepared',runtime:'managed',load:'由实际模型 schema 决定'};
const tools={mcp:{enabled:true,discovered:true,allowed:['inspect_csv','concat_csv','filter_rows','aggregate_csv','write_report']},cli:{enabled:false,discovered:false,allowed:[]}};
const combos=new Set(['内置 Agent|local|1|1']);
const profiles=[{id:'p-local',name:'本地资料处理 · 演示',h:'内置 Agent',m:'local',mr:1,tr:1}];
const sessions=[{id:'c1',title:'门店销售汇总',p:'p-local',messages:[{role:'assistant',text:'三份示例 CSV 已准备好。你可以先汇总，再继续追问，或修改规则重新处理。'}],draft:'按门店汇总销售额，保留负数金额。',files:['input-01'],artifacts:[],tasks:[],archived:false,recovery:false,readOnly:false},
{id:'c2',title:'上次的异常核对',p:'p-local',messages:[{role:'user',text:'检查负数记录，并解释结果。'},{role:'assistant',text:'发现 1 行负数记录，正在核对原因…',interrupted:true}],draft:'',files:['input-01'],artifacts:['a-old'],tasks:[],archived:false,recovery:true,unknown:true,readOnly:true},
{id:'c3',title:'已归档的季度样例',p:'p-local',messages:[{role:'assistant',text:'归档会话保留历史，取消归档并检查后才能继续。'}],draft:'',files:[],artifacts:[],tasks:[],archived:true,recovery:false,readOnly:false}];
const artifacts={'a-old':{id:'a-old',name:'上次汇总.csv',total:700,count:6,excluded:0,task:'历史任务',exported:false,reviewed:false,complete:false}};
const current=()=>sessions.find(x=>x.id===cid);
const profileOf=s=>profiles.find(p=>p.id===s.p);
const comboKey=(h,m)=>`${h}|${m}|${m==='local'?local.rev:model.rev}|${toolRevision}`;
const modelReady=m=>m==='local'?local.installed&&local.capable:model.saved&&model.key&&model.connected&&model.capable;
const profileReady=p=>!!p&&modelReady(p.m)&&p.mr===(p.m==='local'?local.rev:model.rev)&&p.tr===toolRevision&&tools.mcp.enabled&&['inspect_csv','aggregate_csv'].every(t=>tools.mcp.allowed.includes(t))&&combos.has(`${p.h}|${p.m}|${p.mr}|${p.tr}`);
const route=p=>`${p.h} · ${p.m==='local'?'本地 / local-demo':p.provider+' / '+p.modelId} · ${p.m==='local'?'离线':'联网推理'}`;
const b=(label,action,cls='',disabled=false,pressed)=>`<button type="button" class="cursor-interaction ${cls}" data-action="${esc(action)}" ${disabled?'disabled':''} ${pressed===undefined?'':`aria-pressed="${pressed}"`}>${label}</button>`;
const check=(label,id,value,disabled=false)=>`<label class="hv-check"><input type="checkbox" data-field="${id}" ${value?'checked':''} ${disabled?'disabled':''}><span>${label}</span></label>`;
const field=(label,name,value,type='text',disabled=false)=>`<label>${label}<input type="${type}" data-field="${name}" value="${esc(value)}" ${disabled?'disabled':''}></label>`;
const select=(label,name,options,value,disabled=false)=>`<label>${label}<select data-field="${name}" ${disabled?'disabled':''}>${options.map(o=>`<option value="${esc(o.value)}" ${o.value===value?'selected':''} ${o.disabled?'disabled':''}>${esc(o.label)}</option>`).join('')}</select></label>`;
function table(heads,data){return `<div class="hv-table"><table><thead><tr>${heads.map(x=>`<th scope="col">${esc(x)}</th>`).join('')}</tr></thead><tbody>${data.map(r=>`<tr>${r.map(v=>`<td>${esc(v)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;}
function invalidate(kind='all'){for(const key of combos){if(kind==='all'||key.split('|')[1]===kind)combos.delete(key);}sessions.forEach(s=>s.tasks.forEach(t=>{if(t.status==='plan'&&(kind==='all'||profileOf(s).m===kind)&&!(kind!=='all'&&t.source==='cli'))t.status='invalid';}));}
function add(role,text,extra={}){current().messages.push({role,text,...extra});}
function allowedSend(){const s=current();return !active&&!s.archived&&!s.readOnly&&!s.recovery&&profileReady(profileOf(s))&&!!s.draft.trim();}
function intent(text){return /解释|为什么/.test(text)?'answer':/异常/.test(text)&&!/[<>]|小于|负数/.test(text)?'clarify':/排除/.test(text)?'reaggregate':/汇总|求和|统计/.test(text)?'aggregate':'unsupported';}
function send(text,forceIntent){if(!allowedSend())return;const s=current(),p=profileOf(s),kind=forceIntent||intent(text);if(kind==='answer'&&!s.artifacts.length){notice='先完成一次汇总，或明确引用已检查的成果。';return;}const payload={cid:s.id,text,kind};if(p.m==='api'){panel={type:'consent',payload};consentResults=kind==='answer';}else begin(payload);}
function begin(payload){const s=current();if(active||payload.cid!==s.id||!profileReady(profileOf(s)))return;add('user',payload.text);s.draft='';panel=null;active={cid:s.id,phase:payload.kind==='answer'?'answering':'planning',kind:payload.kind};}
function canExecute(t,s=current()){return !active&&!s.archived&&!s.readOnly&&!s.recovery&&t.status==='plan'&&t.rev===toolRevision&&(t.source==='cli'?tools.cli.enabled&&tools.cli.allowed.includes('aggregate'):profileReady(profileOf(s)));}
function taskCard(t){const p=profileOf(current());return `<section class="hv-card"><div class="hv-between"><h3>${t.name}</h3><span class="hv-badge">${({plan:'待确认',invalid:'配置已变，计划失效',running:'执行中',done:'已完成',stopped:'已停止',failed:'失败'})[t.status]}</span></div><div class="hv-detail"><small>规则与输入</small>${t.kind==='reaggregate'?'排除销售额小于 0 的记录，再按门店求和。':'全部 6 行按门店求和，负数金额参与汇总。'}<p class="hv-sub">3 份 CSV · 输入只读 · 数值异常时暂停</p></div><div class="hv-detail"><small>执行快照</small>${esc(t.route)}${t.authorization?`<p class="hv-sub">授权目标：${esc(t.authorization.endpoint)}<br>范围：${esc(t.authorization.scope)}</p>`:''}<p class="hv-sub">${t.source==='cli'?'CLI aggregate · 参数列表，退出码与结果校验':'MCP inspect_csv → aggregate_csv · 仅工作空间输出区'}</p></div><div class="hv-detail"><small>输出</small>${esc(t.output)} · 宿主导出另行确认</div>${t.status==='plan'?`<div class="hv-actions">${b('确认并执行','execute:'+t.id,'hv-primary',!canExecute(t))}${b('取消计划','cancel-plan:'+t.id)}</div>`:''}${t.status==='done'?'<p class="hv-sub">结果已校验，可在右侧预览。会话可继续追问。</p>':''}</section>`;}
function chat(){const s=current(),p=profileOf(s);return `<div class="hv-chat-layout"><main class="hv-chat"><div class="hv-between"><div><div class="hv-eyebrow">CONVERSATION / ${esc(s.id)}</div><h2>${esc(s.title)}</h2></div><span class="hv-badge">${s.archived?'已归档':s.recovery?'待恢复':s.readOnly?'只读':'会话'}</span></div><p class="hv-sub">${esc(route(p))}</p><div class="hv-row">${b('选择方案 / 新建会话并切换','switch','',!!active)}${b('会话管理','manage-session')}</div>${panelHtml()}${s.recovery?`<section class="hv-card hv-approval"><h3>历史已恢复，继续方式尚待检查</h3><p class="hv-sub">回复未完成${s.unknown?'；另有操作结果待核查':''}。不会自动重发或重放工具。</p><div class="hv-actions">${b('模拟检查原生恢复','recover-check','',!!active||s.unknown)}${s.unknown?b('核查未知工具结果','inspect-unknown','',!!active):''}${b('预览摘要并新建','rebuild','',!!active)}</div></section>`:''}${s.messages.map(m=>`<article class="hv-message ${m.role==='user'?'hv-user':''}"><div class="hv-speaker">${m.role==='user'?'你':'Havenbox'}${m.interrupted?' · 回复未完成':''}</div><div>${esc(m.text)}</div>${m.task?taskCard(s.tasks.find(t=>t.id===m.task)):''}</article>`).join('')}${active&&active.cid===s.id?`<section class="hv-card"><h3>${({planning:'正在生成计划',answering:'正在回答',running:'正在执行工具',stopping:'正在停止',cleanup:'清理未确认'})[active.phase]}</h3><p class="hv-sub">${active.phase==='running'?'执行与计算留在隔离空间，当前输出尚未完成。':active.phase==='stopping'?'等待推理、工具与进程树终止确认。':'本稿通过按钮模拟事件，不会发送任何请求。'}</p><div class="hv-actions">${['planning','answering'].includes(active.phase)?b('模拟收到回复','reply'):''}${active.phase==='running'?b('模拟结果校验通过','finish')+b('模拟调用失败','fail','hv-danger')+b('模拟输出校验失败','validation-fail','hv-danger'):''}${active.phase==='stopping'?b('模拟清理确认','clean','hv-primary')+b('模拟清理失败','cleanup-fail','hv-danger'):''}${active.phase==='cleanup'?b('模拟关闭工作空间并确认清理','close-workspace','hv-danger'):''}${!['stopping','cleanup'].includes(active.phase)?b('停止本轮','stop','hv-danger'):''}</div></section>`:''}<div class="hv-composer"><label for="hv-draft">继续这项工作</label><textarea id="hv-draft" data-field="draft" placeholder="描述任务，或对上一份成果继续追问…" ${s.archived||s.readOnly?'disabled':''}>${esc(s.draft)}</textarea><div class="hv-actions">${b(p.m==='api'?'检查发送范围并继续':'发送 / 生成计划','send','hv-primary',!allowedSend())}${b('填入汇总示例','example:aggregate','',s.archived||s.readOnly)}${b('解释负数','example:answer','',s.archived||s.readOnly)}${b('排除负数再汇总','example:reaggregate','',s.archived||s.readOnly)}</div><p class="hv-sub">${active&&active.cid!==s.id?'其他会话正在处理；可以编辑草稿，当前不能发送。':s.archived?'取消归档并检查后继续。':s.readOnly?'历史可读；继续前需完成恢复检查。':!profileReady(p)?'执行方案需要重新检查；历史仍可浏览。':'一轮结束后可继续追问；文件操作会单独确认。'}</p></div></main><aside class="hv-files"><div class="hv-between"><h3>资料与成果</h3><span class="hv-sub">仅本会话</span></div>${b('载入示例 CSV','import','',!!active||s.archived||s.readOnly)}${s.files.map(f=>`<div class="hv-file">${b('输入 · 3 份 CSV','preview:input')}<small>共 6 行 · 只读副本 · 引用 ${esc(f)}</small></div>`).join('')}${s.artifacts.map(id=>{const a=artifacts[id];return `<div class="hv-file">${b(esc(a.name),'preview:'+id)}<small>${esc(a.task)} · ${a.complete?'完整成果':'结果待核查'}<br>${a.exported?'模拟已导出':'尚未导出'}</small></div>`;}).join('')}${previewHtml()}<p class="hv-sub hv-space">原件保持不变。文件引用仅向当前会话开放，跨会话带入需明确选择。</p></aside></div>`;}
function previewHtml(){const s=current();if(!preview)return '';if(preview==='input'&&s.files.length)return `<section class="hv-space"><h3>输入预览</h3>${table(['订单','门店','销售额'],rows.slice(0,3).map(r=>[r[0],r[1],r[2].toFixed(2)]))}<p class="hv-sub">前 3 行，共 6 行 · 设计样例</p></section>`;if(!s.artifacts.includes(preview))return '';const a=artifacts[preview],r=a.excluded?rows.filter(x=>x[2]>=0):rows;const groups=Object.entries(r.reduce((sum,x)=>(sum[x[1]]=(sum[x[1]]||0)+x[2],sum),{}));return `<section class="hv-space"><h3>${esc(a.name)}</h3>${table(['门店','销售额合计'],groups.map(([k,v])=>[k,v.toFixed(2)]))}<p class="hv-sub">完整预览 · ${a.count} 行参与，${a.excluded} 行排除，合计 ${a.total.toFixed(2)}</p><div class="hv-actions">${b('选择导出位置（模拟）','export:'+a.id,'hv-primary',!a.complete)}</div>${a.exported?'<p class="hv-sub">动线演示完成，未写入宿主文件。</p>':''}</section>`;}
function panelHtml(){if(!panel)return '';const s=current();if(panel.type==='consent'){const payload=panel.payload,p=profileOf(s);return `<section class="hv-card hv-approval" aria-label="联网数据授权"><h3>在生成计划或回答前，确认发送范围</h3><p>${esc(model.name)} · ${esc(model.url)}<br><code>${esc(model.id)}</code></p><p class="hv-warn hv-sub">这些内容会离开本机，服务商可能计费并按其政策保留数据。撤销不能收回已发送内容。</p><div class="hv-detail"><small>本次任务文字</small>${esc(payload.text)}</div><div class="hv-detail"><small>历史与文件范围</small>${s.messages.length?'摘要预览：'+esc(summary(s))+'；不含其他会话。':'无历史。'}<br>输入仅发送列名：订单号、门店、销售额；不发送完整 CSV。</div>${check('包含当前会话已选工具结果摘要；用于解释数值','consentResults',consentResults)}<p class="hv-sub">${s.artifacts.length?'可发送摘要：'+esc(s.artifacts.map(id=>`${artifacts[id].name}，合计 ${artifacts[id].total.toFixed(2)}`).join('；')):'当前无工具结果。'}${payload.kind==='answer'&&!consentResults?' 当前问题需要结果摘要，请批准或取消修改问题。':''}</p><div class="hv-actions">${b('批准本轮发送（模拟）','authorize','hv-primary',payload.kind==='answer'&&!consentResults)}${b('取消，不发送','cancel-panel')}</div></section>`;}
if(panel.type==='new'){return `<section class="hv-card hv-approval"><h3>${panel.carry?'新建会话并切换':'新建会话'}</h3>${select('执行方案','targetProfile',profiles.map(p=>({value:p.id,label:p.name+' · '+route(p)+(profileReady(p)?' · 演示验证有效':' · 需检查'),disabled:!profileReady(p)})),targetProfile)}${panel.carry?check('带入以下历史摘要','carryText',carryText)+`<p class="hv-sub">摘要预览：${esc(summary(s))}</p>`+check('带入当前会话的文件与成果引用','carryFiles',carryFiles)+`<p class="hv-sub">引用预览：${esc([...s.files,...s.artifacts].join('、')||'无')}。不复制内部 harness 状态。</p>`:''}<div class="hv-actions">${b('创建会话','create','hv-primary',!profiles.some(p=>p.id===targetProfile&&profileReady(p)))}${b('取消','cancel-panel')}</div></section>`;}
if(panel.type==='manage')return `<section class="hv-card"><h3>会话管理</h3>${field('会话标题','rename',rename)}<div class="hv-actions">${b('保存名称','rename')}${b(s.archived?'取消归档':'归档','archive','',!!active&&active.cid===s.id)}${b('删除会话…','delete-dialog','hv-danger',!!active&&active.cid===s.id)}${b('关闭','cancel-panel')}</div><p class="hv-sub">活动会话需先停止并确认清理，才能归档或删除。</p></section>`;
if(panel.type==='delete')return `<section class="hv-card hv-approval"><h3>删除“${esc(s.title)}”？</h3><p>删除独有历史和附件引用。其他会话仍引用的成果、宿主原件及已导出文件保留。</p><div class="hv-actions">${b('取消','cancel-panel')}${b('确认删除会话','delete','hv-danger',!!active&&active.cid===s.id)}</div></section>`;
if(panel.type==='test')return `<section class="hv-card hv-approval"><h3>允许发送连接测试？</h3><p>${esc(model.url)} · ${esc(model.id)}</p><p class="hv-sub">固定提示“回复 READY”及最小工具 schema。不发送业务文件、草稿或会话历史。可能产生费用。</p><div class="hv-actions">${b('模拟测试通过','test-pass','hv-primary')}${b('模拟认证失败','test-fail','hv-danger')}${b('取消','cancel-panel')}</div></section>`;
return '';}
function summary(s){return `会话“${s.title}”：${s.artifacts.length?'已有 '+s.artifacts.length+' 份成果；':''}三份销售资料，曾讨论门店汇总。${s.unknown?'操作结果尚未确认，不能重放。':''}`;}
function modelsPage(){return `<main class="hv-section"><div class="hv-eyebrow">MODELS & CONNECTIONS</div><h2>模型独立配置，兼容方案共用。</h2><p class="hv-sub">联网方案无需安装本地模型。Key 仅宿主保存，来宾通过受限代理请求。</p><div class="hv-row">${b('联网 API','model-api','',false,modelTab==='api')}${b('本地资源','model-local','',false,modelTab==='local')}</div>${modelTab==='api'?`<div class="hv-grid"><section class="hv-form">${select('来源模板','template',[{value:'custom',label:'自定义 API'},{value:'kimi',label:'Kimi API 模板 · 端点待官方配置'},{value:'deepseek',label:'DeepSeek API 模板 · 端点待官方配置'}],model.template,!!active)}${field('连接名称','name',model.name,'text',!!active)}${select('API 协议 · 适配须验证','protocol',[{value:'chat-completions',label:'OpenAI Chat Completions'},{value:'messages',label:'Anthropic Messages'}],model.protocol,!!active)}${field('Base URL · 当前为保留的演示域名','url',model.url,'url',!!active)}${field('模型 ID · 可手填','id',model.id,'text',!!active)}<label>API Key<input type="password" placeholder="演示稿不接收真实 API Key" disabled></label><div class="hv-row">${b(model.key?'模拟替换凭据':'模拟保存凭据','key','',!!active)}${b('撤销凭据','revoke','hv-danger',!!active||!model.key)}</div></section><section><h3>配置状态 · 全部为演示</h3><div class="hv-detail">配置：${model.saved?'已保存':'未保存'}</div><div class="hv-detail">凭据：${model.key?'模拟已保存，无真实 Key':'未保存'}</div><div class="hv-detail">连接：${model.connected?'模拟连接通过':'尚未检查'}</div><div class="hv-detail">能力：${model.capable?'模拟流式与工具检查通过':'尚未验证'}</div><p class="hv-sub">保存不代表可用。组合验证在“接入与方案”继续完成。</p><h3 class="hv-space">推理与资源限制</h3><div class="hv-form">${field('温度 · 按实际协议 schema 校验','temperature',model.temperature,'text',!!active)}${field('上下文上限','context',model.context,'text',!!active)}${field('输出上限','output',model.output,'text',!!active)}${field('超时','timeout',model.timeout,'text',!!active)}${field('用量上限','quota',model.quota,'text',!!active)}</div></section></div><div class="hv-actions">${b('保存连接草稿','save-model','hv-primary',!!active||!model.url||!model.id)}${b('检查连接与能力…','test-model','',!!active||!model.saved||!model.key)}</div>${panelHtml()}`:`<section class="hv-card"><h3>本地模型与受管运行时</h3><div class="hv-form">${select('离线资源包 · 本稿不读取文件','localPackage',[{value:'prepared',label:'已准备的示例量化包'},{value:'other',label:'其他离线包 · 待检查'}],local.package,!!active)}${select('受管运行时','localRuntime',[{value:'managed',label:'受管本地运行时 · 版本待实测'}],local.runtime,!!active)}${field('加载参数 · 以实际 schema 为准','localLoad',local.load,'text',!!active)}</div><p>模型 ID：local-demo · 离线包与量化版本：示例</p><p class="hv-sub">校验和、运行时版本、加载参数与资源占用由实际包读取。本稿不下载或加载模型。</p><span class="hv-badge">${local.installed?'演示资源已准备':'资源未安装'}</span><div class="hv-actions">${b('模拟校验并加载离线包','local-install','hv-primary',!!active)}${b('模拟资源缺失','local-missing','',!!active)}</div><p class="hv-sub">资源缺失不会阻断已验证联网方案。</p></section>`}</main>`;}
function toolsPage(){const tt=toolTab==='cli'?'cli':'mcp',t=tools[tt];const names=tt==='mcp'?['inspect_csv','concat_csv','filter_rows','aggregate_csv','write_report']:['inspect','aggregate'];const modelOptions=[{value:'local',label:'本地 · local-demo'},{value:'api',label:model.name+' · '+model.id+' · 联网'}];const combination=combos.has(comboKey(harness,binding));return `<main class="hv-section"><div class="hv-eyebrow">HARNESSES / TOOLS / PROFILES</div><h2>执行主体、推理与工具，分别选择。</h2><div class="hv-row">${['harness','mcp','cli'].map(k=>b(({harness:'Harness 与执行方案',mcp:'MCP 服务',cli:'CLI 工具'})[k],'tools-tab:'+k,'',false,toolTab===k)).join('')}</div>${toolTab==='harness'?`<div class="hv-grid"><section class="hv-form">${select('Harness','harness',['内置 Agent','Kimi CLI','Pi','dsh'].map(x=>({value:x,label:x})),harness,!!active)}<p class="hv-sub">适配方向：Kimi ACP / Pi RPC / dsh SDK profile。具体版本与接入均未实测。</p>${select('独立选择模型配置','binding',modelOptions,binding,!!active)}<p class="hv-sub">${binding==='api'?'联网推理只经过宿主网关，不依赖本地模型。':'本地推理只走受管本机路由。'}</p><div class="hv-detail">工具范围：${tools.mcp.enabled?esc(tools.mcp.allowed.join('、')):'MCP 未启用'}<p class="hv-sub">CLI ${tools.cli.enabled?'已启用':'未启用'}；默认不开放任意命令。</p></div></section><section><h3>组合检查 · 演示矩阵</h3>${['固定版本与会话接口','流式输出与工具审批','MCP 桥接与受限调用','停止与子进程清理','历史恢复策略'].map(x=>`<div class="hv-detail">${x}<span class="hv-sub"> · ${combination?'模拟检查通过':'待验证'}</span></div>`).join('')}<p class="hv-warn hv-sub">未验证组合只能配置，不能进入真实执行。本稿的模拟通过不构成产品支持承诺。</p></section></div><div class="hv-actions">${b('模拟检查当前组合','verify-combo','hv-primary',!!active||!modelReady(binding)||!tools.mcp.enabled)}${b('保存执行方案','save-profile','',!!active||!combination)}</div><h3 class="hv-space">可复用执行方案</h3>${profiles.map(p=>`<div class="hv-detail">${esc(p.name)}<p class="hv-sub">${esc(route(p))} · ${profileReady(p)?'演示验证有效':'检查已失效'}</p></div>`).join('')}`:`<section class="hv-card"><div class="hv-between"><h3>${tt==='mcp'?'本地 CSV MCP 服务 · stdio':'CSV CLI · 受管参数模板'}</h3><span class="hv-badge">${t.enabled?'演示已启用':t.discovered?'待授权':'未检查'}</span></div><p class="hv-sub">仅预装隔离环境程序。输入只读，输出与临时区可写，不继承宿主凭据，不经 shell 拼接。</p><details><summary>查看受管配置摘要</summary><pre>${tt==='mcp'?'executable: /opt/havenbox/bin/csv-mcp\nargv: ["--transport", "stdio"]':'executable: /opt/havenbox/bin/csv-tool\nargv: ["aggregate", "--input-id", "input-01", "--group", "门店", "--sum", "销售额"]'}\n工作目录 / 环境变量白名单 / 时限 / 输出上限：由实际受管配置提供</pre></details>${t.discovered?names.map(n=>check(`<code>${n}</code> · ${n.startsWith('inspect')?'读取输入':'创建工作空间成果'}`,'tool:'+tt+':'+n,t.allowed.includes(n),!!active)).join(''):'<p class="hv-sub">检查后发现工具；发现不代表授权。</p>'}<div class="hv-actions">${b('模拟检查 / 发现工具','discover:'+tt,'',!!active)}${b('保存权限并启用','enable:'+tt,'hv-primary',!!active||!t.discovered||!t.allowed.length)}${b('禁用','disable:'+tt,'hv-danger',!!active||!t.enabled)}${tt==='cli'?b('生成确定性 CLI 计划','cli-plan','',!!active||!t.enabled||!t.allowed.includes('aggregate')||current().archived||current().readOnly):''}</div><p class="hv-sub">确定性 CLI 可不调用模型独立执行；启用输出权限仍不能直接写宿主。</p></section>`}</main>`;}
function records(){return `<main class="hv-section"><div class="hv-eyebrow">HISTORY / CALL EVIDENCE</div><h2>每次执行都能回到来源。</h2><p class="hv-sub">记录关联会话、回合、任务、模型路由、授权和文件版本。这里只显示固定示例摘要。</p>${sessions.flatMap(s=>s.tasks.map(t=>`<section class="hv-card"><div class="hv-between"><h3>${esc(s.title)} · ${esc(t.id)}</h3><span class="hv-badge">${esc(({plan:'待确认',invalid:'计划失效',running:'执行中',done:'已完成',failed:'失败',stopped:'已停止'})[t.status]||t.status)}</span></div><pre>${esc(t.route)}\n${t.authorization?esc("授权: "+t.authorization.endpoint+" / "+t.authorization.scope):"授权: 本机处理，不发送模型业务数据"}\n${t.source==='cli'?'CLI argv: [aggregate, --input-id, input-01, --group, 门店, --sum, 销售额]':'MCP: inspect_csv → aggregate_csv'}\n${t.status==='failed'?(t.validationFailure?(t.source==='cli'?'exit: 0 / output validation: failed':'tool success / output validation: failed'):(t.source==='cli'?'exit: 2 / stderr: 示例参数错误':'tool error: 示例参数错误')):t.status==='done'?(t.source==='cli'?'exit: 0 / output validation: passed':'tool success / output validation: passed'):'尚无完整成功结果'}\n清理: ${active&&active.cid===s.id?active.phase==='cleanup'?'未确认':'等待终止或完成':'本次演示无活动进程'}</pre>${b('返回此会话','session:'+s.id)}</section>`)).join('')||'<p class="hv-sub">尚无本轮调用记录。</p>'}${current().unknown?'<section class="hv-card"><h3>历史调用 · 结果待核查</h3><p class="hv-sub">已有部分成果，但终止结果缺失；不自动重跑。</p></section>':''}</main>`;}
function settingsPage(){return `<main class="hv-section"><div class="hv-eyebrow">WORKSPACE / RECOVERY</div><h2>环境维护与工作数据</h2><p class="hv-sub">本稿版本、资源占用与隔离状态均未实测。模型资源与凭据配置有独立入口。</p><section class="hv-card"><h3>模拟重启后浏览历史</h3><p>先恢复消息与成果索引，再检查能否继续对话；不重放旧工具或重发请求。</p><div class="hv-actions">${b('模拟重启并检查恢复','restart','',!!active)}</div></section><section class="hv-card"><h3>清空工作空间</h3><p class="hv-sub">删除会话、输入副本、成果和任务记录。保留宿主原件、已导出文件、模型包与独立连接配置。不是安全擦除，也不能撤回已发送数据。</p>${b('清空工作空间…','reset-dialog','hv-danger',!!active)}</section>${panel?.type==='reset'?`<section class="hv-card hv-approval"><h3>确认清空所有工作数据？</h3><p>尚未导出的成果将丢失，模型包和连接凭据不随此操作删除。</p><div class="hv-actions">${b('取消','cancel-panel')}${b('确认清空（模拟）','reset','hv-danger',!!active)}</div></section>`:''}<p class="hv-sub">运行中先停止并确认进程清理，维护动作才可用。真实产品的退出同样等待终止，不转后台。</p></main>`;}
function render(){const s=current();const content=page==='chat'?chat():page==='models'?modelsPage():page==='tools'?toolsPage():page==='settings'?settingsPage():records();root.innerHTML=`<header class="hv-top"><div class="hv-brand"><span class="hv-logo">H</span>Havenbox</div><nav class="hv-nav" aria-label="工作空间导航">${[['chat','会话'],['models','模型与连接'],['tools','接入与方案'],['records','运行记录'],['settings','设置']].map(([k,v])=>b(v,'page:'+k,'',false,page===k)).join('')}</nav></header><div class="hv-demo"><span>设计演示 · 所有检查、消息与进程状态均为模拟</span><span>不联网、不读取文件、不保存真实密钥</span></div>${active?`<section class="hv-live" aria-label="全局活动任务"><p>${esc(sessions.find(x=>x.id===active.cid).title)} 正在${({planning:'规划',answering:'回答',running:'执行',stopping:'停止',cleanup:'等待清理核查'})[active.phase]} · 单活动回合</p><div class="hv-row">${b('返回活动会话','return-active')}${b('停止','stop','hv-danger',['stopping','cleanup'].includes(active.phase))}</div></section>`:''}<div class="hv-layout"><aside class="hv-side" aria-label="会话列表">${b('+ 新建会话','new','hv-new')}<label for="hv-search" class="hv-sub">搜索会话标题</label><input id="hv-search" data-field="search" value="${esc(search)}" placeholder="搜索标题">${b(archiveFilter?'查看近期会话':'查看归档','filter','hv-quiet')}<div id="hv-session-list">${sessionList()}</div><p class="hv-sub hv-space">一个工作空间<br>多条会话 · 单活动回合</p></aside><div class="hv-content"><div role="status" aria-live="polite" class="hv-sub" style="padding:0 18px">${esc(notice)}</div>${content}</div></div><footer class="hv-footer">PRD V0.5 · 真实兼容性、隔离、持久化与网络授权执行尚未验证 · 旧稿仅作历史参考</footer>`;}
function sessionList(){return sessions.filter(s=>s.archived===archiveFilter&&s.title.toLowerCase().includes(search.toLowerCase())).map(s=>b(`<span>${esc(s.title)}<small>${active&&active.cid===s.id?'处理中':s.recovery?'历史可读 · 待恢复':s.archived?'已归档':'本地历史'} · ${esc(s.id)}</small></span>`,'session:'+s.id,'hv-session',false,s.id===cid)).join('')||'<p class="hv-sub">没有匹配会话。</p>';}
function newSession(p,source){const s={id:'c'+serial++,title:source?'从“'+source.title+'”继续':'新会话',p,messages:[],draft:'',files:[],artifacts:[],tasks:[],archived:false,recovery:false,readOnly:false};if(source&&carryText)s.messages.push({role:'assistant',text:'带入摘要：'+summary(source)});if(source&&carryFiles){s.files=[...source.files];s.artifacts=[...source.artifacts];}sessions.unshift(s);cid=s.id;panel=null;preview=null;page='chat';archiveFilter=false;search='';}
function makeTask(kind,source='mcp'){const s=current(),t={id:'task-'+serial++,kind,source,rev:toolRevision,route:source==='cli'?'确定性 CSV CLI · 不调用模型':route(profileOf(s)),inputs:[...s.files],authorization:source==='cli'||profileOf(s).m==='local'?null:{...s.authorization},status:'plan',output:kind==='reaggregate'?'门店汇总_排除负数.csv':'门店汇总_含负数.csv',name:kind==='reaggregate'?'排除负数后的门店汇总':'门店销售额汇总'};s.tasks.push(t);add('assistant','请核对本次独立处理计划。',{task:t.id});}
function finishTask(ok,validationFailure=false){const s=sessions.find(x=>x.id===active.cid),t=s.tasks.find(x=>x.id===active.task);if(!t)return;if(ok){t.status='done';const filtered=t.kind==='reaggregate',data=filtered?rows.filter(r=>r[2]>=0):rows,id='a'+serial++;artifacts[id]={id,name:t.output,task:t.id,total:data.reduce((a,r)=>a+r[2],0),count:data.length,excluded:rows.length-data.length,exported:false,reviewed:false,complete:true};s.artifacts.push(id);s.messages.push({role:'assistant',text:`确定性示例工具处理完成：${data.length} 行参与，${rows.length-data.length} 行排除，销售额合计 ${artifacts[id].total.toFixed(2)}。可预览后继续追问。`});preview=id;artifacts[id].reviewed=true;}else{t.status='failed';t.validationFailure=validationFailure;s.messages.push({role:'assistant',text:validationFailure?(t.source==='cli'?'示例 CLI 退出码为 0，但输出校验失败，不能显示任务成功。':'示例 MCP 工具返回成功，但输出校验失败，不能显示任务成功。'):'示例调用失败：参数未通过校验。部分输出不能标为成功，不自动换工具或模型。'});}active=null;}
root.addEventListener('click',e=>{
const el=e.target.closest('button[data-action]');if(!el||el.disabled)return;const [a,v]=el.dataset.action.split(':');const closingPanel=panel?.type;notice='';
if(a==='page'){page=v;panel=null;}
else if(a==='session'){cid=v;page='chat';panel=null;preview=null;}
else if(a==='return-active'&&active){cid=active.cid;page='chat';panel=null;}
else if(a==='filter')archiveFilter=!archiveFilter;
else if(a==='new'||a==='switch'||a==='rebuild'){if(a!=='new'&&active)return;panel={type:'new',carry:a!=='new'};carryText=false;carryFiles=false;targetProfile=profiles.find(profileReady)?.id||'p-local';page='chat';}
else if(a==='create'&&panel?.type==='new'&&profiles.some(p=>p.id===targetProfile&&profileReady(p))){const source=panel.carry?current():null;newSession(targetProfile,source);}
else if(a==='cancel-panel')panel=null;
else if(a==='manage-session'){rename=current().title;panel={type:'manage'};}
else if(a==='rename'&&rename.trim()){current().title=rename.trim();panel=null;}
else if(a==='archive'&&!(active&&active.cid===cid)){const s=current();s.archived=!s.archived;if(!s.archived){s.recovery=true;s.readOnly=true;}archiveFilter=s.archived;panel=null;}
else if(a==='delete-dialog'&&!(active&&active.cid===cid))panel={type:'delete'};
else if(a==='delete'&&panel?.type==='delete'&&!(active&&active.cid===cid)){const index=sessions.findIndex(s=>s.id===cid);sessions.splice(index,1);Object.keys(artifacts).forEach(id=>{if(!sessions.some(s=>s.artifacts.includes(id)))delete artifacts[id];});if(!sessions.length)newSession('p-local',null);else cid=sessions[0].id;panel=null;preview=null;archiveFilter=current().archived;}
else if(a==='recover-check'&&!active&&!current().unknown){if(profileReady(profileOf(current()))){current().recovery=false;current().readOnly=false;notice='模拟原生恢复检查通过；未重发历史请求。真实恢复策略仍需实测。';}else notice='模型或配置已失效，历史仍可浏览。请修复或预览摘要新建。';}
else if(a==='inspect-unknown'&&!active){current().unknown=false;current().artifacts.forEach(id=>artifacts[id].complete=true);notice='演示核查：已有成果与本地记录一致，不重放旧工具。回复仍保持未完成标识。';}
else if(a==='import'&&!active&&!current().archived&&!current().readOnly){current().files=['input-01'];notice='已载入 3 份演示 CSV；不读取宿主文件。';}
else if(a==='example'){current().draft=({aggregate:'按门店汇总销售额，保留负数金额。',answer:'解释为什么出现负数记录。',reaggregate:'排除负数金额后，重新按门店汇总。'})[v];}
else if(a==='send')send(current().draft);
else if(a==='authorize'&&panel?.type==='consent'&&!active&&(panel.payload.kind!=='answer'||consentResults)){const payload=panel.payload;current().authorization={provider:model.name,endpoint:model.url,model:model.id,scope:'任务文字、当前会话摘要、输入字段'+(consentResults?'、所选结果摘要':''),cid};begin(payload);notice='模拟批准本轮发送；没有实际网络请求。';}
else if(a==='reply'&&active&&active.cid===cid){const kind=active.kind;active=null;if(kind==='answer'){add('assistant','示例结果中有一行销售额为 -20.00。负数可能是冲销或退货，仅凭当前字段不能确认业务原因；可回查原始记录。此次只读解释，没有新执行任务。');}else if(kind==='clarify'){add('assistant','请明确异常规则，例如“销售额小于 0”。规则未明确前不执行。');}else if(kind==='unsupported'){add('assistant','本设计稿仅演示门店汇总、解释结果、规则澄清和排除负数后重新汇总。此输入未匹配演示场景，未生成执行计划。');}else if(!current().files.length){add('assistant','请先载入或明确引用输入 CSV。当前未执行任何文件操作。');}else makeTask(kind);}
else if(a==='execute'&&!active){const t=current().tasks.find(t=>t.id===v);if(t&&canExecute(t)){t.status='running';active={cid,phase:'running',task:t.id};}}
else if(a==='cancel-plan'){const t=current().tasks.find(t=>t.id===v);if(t?.status==='plan')t.status='stopped';}
else if(a==='finish'&&active?.phase==='running')finishTask(true);
else if(a==='fail'&&active?.phase==='running')finishTask(false);
else if(a==='validation-fail'&&active?.phase==='running')finishTask(false,true);
else if(a==='stop'&&active&&!['stopping','cleanup'].includes(active.phase)){active.phase='stopping';}
else if(a==='clean'&&active?.phase==='stopping'){const s=sessions.find(s=>s.id===active.cid);if(active.task)s.tasks.find(t=>t.id===active.task).status='stopped';else s.messages.push({role:'assistant',text:'本轮已停止，回复未完成。不会自动重发。',interrupted:true});active=null;notice='演示清理已确认，工作空间可接收下一回合。';}
else if(a==='cleanup-fail'&&active?.phase==='stopping'){active.phase='cleanup';notice='清理尚未确认，保持单活动限制。真实产品提供关闭工作空间兜底。';}
else if(a==='close-workspace'&&active?.phase==='cleanup'){const owner=sessions.find(s=>s.id===active.cid);if(active.task)owner.tasks.find(t=>t.id===active.task).status='stopped';else owner.messages.push({role:'assistant',text:'工作空间关闭后的终止已在演示中确认，原回复仍未完成。',interrupted:true});active=null;sessions.forEach(s=>{if(!s.archived){s.recovery=true;s.readOnly=true;}});notice='模拟关闭并确认清理，历史保持可读；继续前重新检查恢复。不代表已终止任何真实进程。';}
else if(a==='preview'){preview=v;if(artifacts[v]&&current().artifacts.includes(v))artifacts[v].reviewed=true;}
else if(a==='export'&&current().artifacts.includes(v)&&artifacts[v].complete&&artifacts[v].reviewed){artifacts[v].exported=true;notice='模拟选择导出位置并完成；未写入宿主文件。';}
else if(a==='restart'&&!active){sessions.forEach(s=>{if(!s.archived){s.recovery=true;s.readOnly=true;}});page='chat';notice='模拟重启后的索引恢复：历史可读，继续前需检查。未真实重启或重放请求。';}
else if(a==='reset-dialog'&&!active)panel={type:'reset'};
else if(a==='reset'&&!active&&panel?.type==='reset'){sessions.splice(0);Object.keys(artifacts).forEach(id=>delete artifacts[id]);newSession(profiles.find(profileReady)?.id||'p-local',null);notice='工作数据已在本次演示中清空，模型与连接配置保留。未删除宿主任何文件。';}
else if(a==='model-api')modelTab='api';else if(a==='model-local')modelTab='local';
else if(a==='key'&&!active){model.key=true;model.rev++;model.connected=false;model.capable=false;invalidate('api');notice='模拟凭据引用已保存。没有存储真实 Key；旧检查已失效。';}
else if(a==='revoke'&&!active){model.key=false;model.connected=false;model.capable=false;model.rev++;invalidate('api');notice='模拟凭据已撤销，联网方案不可再发送；本地历史仍可查看。';}
else if(a==='save-model'&&!active){try{const u=new URL(model.url);if(u.protocol!=='https:'||!model.id.trim())throw new Error('invalid');model.saved=true;model.rev++;model.connected=false;model.capable=false;invalidate('api');notice='连接草稿已保存。真实实现还需解析地址、重定向与网关边界校验。';}catch{notice='请输入 HTTPS Base URL 和模型 ID。';}}
else if(a==='test-model'&&!active&&model.saved&&model.key)panel={type:'test'};
else if(a==='test-pass'&&panel?.type==='test'){model.connected=true;model.capable=true;panel=null;notice='模拟认证、协议、流式与工具检查通过。下一步检查 harness 组合。';}
else if(a==='test-fail'&&panel?.type==='test'){model.connected=false;model.capable=false;panel=null;invalidate('api');notice='模拟认证失败，未自动换提供方或本地模型。';}
else if(a==='local-install'&&!active){local.installed=true;local.capable=true;local.rev++;invalidate('local');notice='模拟离线包校验与加载完成，需重新验证引用它的组合。';}
else if(a==='local-missing'&&!active){local.installed=false;local.capable=false;local.rev++;invalidate('local');notice='模拟本地资源缺失，联网连接不需要本地模型。';}
else if(a==='tools-tab')toolTab=v;
else if(a==='verify-combo'&&!active&&modelReady(binding)&&tools.mcp.enabled){if(binding==='local'&&['Kimi CLI','dsh'].includes(harness)){notice='当前演示矩阵未覆盖此本地组合，不能保存为可执行方案。';}else{combos.add(comboKey(harness,binding));notice='模拟组合检查通过：会话、流式、工具、停止与恢复方向。真实适配未验证。';}}
else if(a==='save-profile'&&!active&&combos.has(comboKey(harness,binding))){const p={id:'p'+serial++,name:harness+' · '+(binding==='local'?'本地':'联网')+' · 演示',h:harness,m:binding,provider:binding==='api'?model.name:'本地',modelId:binding==='api'?model.id:'local-demo',endpoint:binding==='api'?model.url:null,mr:binding==='local'?local.rev:model.rev,tr:toolRevision};profiles.push(p);notice='执行方案已保存，可新建会话使用。模型配置供其他兼容 harness 复用。';}
else if(a==='discover'&&!active){tools[v].discovered=true;tools[v].enabled=false;tools[v].allowed=[];toolRevision++;invalidate();notice='模拟发现完成；请选择权限，发现不代表授权。';}
else if(a==='enable'&&!active&&tools[v].allowed.length){tools[v].enabled=true;toolRevision++;invalidate();notice='工具范围已保存；相关方案及旧计划需重新验证。';}
else if(a==='disable'&&!active){tools[v].enabled=false;toolRevision++;invalidate();notice='接入项已禁用（模拟），不能再产生新调用。';}
else if(a==='cli-plan'&&!active&&tools.cli.enabled&&tools.cli.allowed.includes('aggregate')&&!current().archived&&!current().readOnly){if(!current().files.length)notice='先为当前会话载入示例输入。';else{makeTask('aggregate','cli');page='chat';notice='已生成不调用模型的确定性 CLI 计划。';}}
render();restoreFocus(a==='cancel-panel'?({consent:'send',new:'switch',manage:'manage-session',delete:'manage-session',test:'test-model',reset:'reset-dialog'}[closingPanel]||el.dataset.action):el.dataset.action);
});
function restoreFocus(action){let target;if(panel){target=root.querySelector('.hv-approval button[data-action="cancel-panel"]:not(:disabled)')||root.querySelector('.hv-approval button:not(:disabled)')||root.querySelector('main input:not(:disabled)');}else if(['reply','cli-plan'].includes(action)){const plans=root.querySelectorAll('button[data-action^="execute:"]:not(:disabled)');target=plans[plans.length-1]||root.querySelector('#hv-draft:not(:disabled)');}else if(['finish','create','clean','rename','close-workspace'].includes(action)){target=root.querySelector('#hv-draft:not(:disabled)')||root.querySelector('main button:not(:disabled)');}else target=root.querySelector(`button[data-action="${action}"]:not(:disabled)`)||root.querySelector('main .hv-actions button:not(:disabled)');if(target)target.focus({preventScroll:true});}
root.addEventListener('keydown',e=>{if(e.key==='Escape'&&panel){e.preventDefault();const type=panel.type;panel=null;render();const back={consent:'send',new:'switch',manage:'manage-session',delete:'manage-session',test:'test-model',reset:'reset-dialog'}[type];restoreFocus(back);}});
function updateField(target){const k=target.dataset.field;if(!k)return;const value=target.type==='checkbox'?target.checked:target.value;if(k==='draft'){current().draft=value;const btn=root.querySelector('[data-action="send"]');if(btn)btn.disabled=!allowedSend();return;}if(k==='search'){search=value;root.querySelector('#hv-session-list').innerHTML=sessionList();return;}if(k==='rename'){rename=value;return;}if(k==='targetProfile')targetProfile=value;else if(k==='carryText')carryText=value;else if(k==='carryFiles')carryFiles=value;else if(k==='consentResults')consentResults=value;else if(k==='harness')harness=value;else if(k==='binding')binding=value;else if(k.startsWith('tool:')&&!active){const [,type,name]=k.split(':');tools[type].allowed=value?[...new Set([...tools[type].allowed,name])]:tools[type].allowed.filter(n=>n!==name);tools[type].enabled=false;toolRevision++;invalidate();}else if(['localPackage','localRuntime','localLoad'].includes(k)&&!active){local[({localPackage:'package',localRuntime:'runtime',localLoad:'load'})[k]]=value;local.capable=false;local.rev++;invalidate('local');render();const next=root.querySelector(`[data-field="${k}"]`);if(next)next.focus({preventScroll:true});return;}else if(Object.hasOwn(model,k)&&!active){model[k]=value;model.saved=false;model.connected=false;model.capable=false;model.rev++;invalidate('api');const pos=target.selectionStart;render();const next=root.querySelector(`[data-field="${k}"]`);if(next){next.focus({preventScroll:true});if(typeof pos==='number'&&next.setSelectionRange&&target.type!=='url')next.setSelectionRange(pos,pos);}return;}else return;render();const next=root.querySelector(`[data-field="${k}"]`);if(next)next.focus({preventScroll:true});}
root.addEventListener('input',e=>{if(!['SELECT'].includes(e.target.tagName)&&e.target.type!=='checkbox')updateField(e.target);});
root.addEventListener('change',e=>{if(e.target.tagName==='SELECT'||e.target.type==='checkbox')updateField(e.target);});
render();
if(globalThis.Tweak){const layout={space:24};const tw=new Tweak({container:root,onChange:()=>root.style.setProperty('--hv-chat-space',layout.space+'px')});tw.addSlider(layout,'space',{label:'消息区留白',min:16,max:32,unit:'px'});}
})();
</script>

</body>
